name: NexOra CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python, Reader API and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/nexora_keygen_test?sslmode=disable
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile Python sources
        run: python -m compileall -q backend tests

      - name: Set up Node for JavaScript syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check frontend JavaScript syntax
        run: |
          find frontend/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check
          find frontend/sms/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check frontend CSS integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          # Core stylesheets — must have balanced braces, keyframes and reduced-motion guards
          core_css = [
              Path("frontend/assets/app.css"),
              Path("frontend/assets/platform.css"),
          ]
          for css in core_css:
              text = css.read_text(encoding="utf-8")
              assert not text.lstrip().startswith("#!"), f"{css}: executable script found instead of CSS"
              assert "def main(argv)" not in text, f"{css}: Python source found inside stylesheet"
              assert text.count("{") == text.count("}"), f"{css}: unbalanced braces"
              assert "@keyframes" in text, f"{css}: animation system missing"
              assert "prefers-reduced-motion" in text, f"{css}: reduced-motion guard missing"
              print(f"{css}: balanced ({text.count('{')} blocks, "
                    f"{text.count('@keyframes')} keyframes)")

          # CustomSelect component stylesheet — must exist and have its own guards
          cs_css = Path("frontend/assets/custom-select.css")
          assert cs_css.exists(), "frontend/assets/custom-select.css is missing"
          cs_text = cs_css.read_text(encoding="utf-8")
          assert cs_text.count("{") == cs_text.count("}"), "custom-select.css: unbalanced braces"
          assert ".custom-select-wrapper" in cs_text, "custom-select.css: .custom-select-wrapper missing"
          assert ".custom-select-trigger" in cs_text, "custom-select.css: .custom-select-trigger missing"
          assert "prefers-reduced-motion" in cs_text, "custom-select.css: reduced-motion guard missing"
          assert "is-invalid" in cs_text, "custom-select.css: is-invalid validation state missing"
          print(f"{cs_css}: ok ({cs_text.count('{')} blocks)")

          # CustomDatePicker component stylesheet — must exist and have its own guards
          cdp_css = Path("frontend/assets/custom-date-picker.css")
          assert cdp_css.exists(), "frontend/assets/custom-date-picker.css is missing"
          cdp_text = cdp_css.read_text(encoding="utf-8")
          assert cdp_text.count("{") == cdp_text.count("}"), "custom-date-picker.css: unbalanced braces"
          assert ".custom-date-picker-wrapper" in cdp_text, "custom-date-picker.css: .custom-date-picker-wrapper missing"
          assert ".custom-date-picker-trigger" in cdp_text, "custom-date-picker.css: .custom-date-picker-trigger missing"
          assert ".custom-date-picker-panel" in cdp_text, "custom-date-picker.css: .custom-date-picker-panel missing"
          assert "prefers-reduced-motion" in cdp_text, "custom-date-picker.css: reduced-motion guard missing"
          assert "is-invalid" in cdp_text, "custom-date-picker.css: is-invalid validation state missing"
          print(f"{cdp_css}: ok ({cdp_text.count('{')} blocks)")
          PY

      - name: Unit and route tests (no external services)
        run: |
          python -m pytest \
            tests/test_unit_keys.py \
            tests/test_nexora_reader_keys.py \
            tests/test_nexora_api_v1.py \
            tests/test_config_security.py \
            tests/test_timezone.py \
            -q -ra

      - name: Reader API activation, credential and revocation tests
        run: python -m pytest -m reader -q -ra

      - name: Security and authentication tests
        run: |
          python -m pytest \
            tests/test_auth_security.py \
            tests/test_sms_frontend.py \
            -q -ra

      - name: Full PostgreSQL integration suite
        run: python -m pytest -q -ra --junitxml=pytest-results.xml

      - name: Report skipped tests
        if: always()
        run: |
          if [ -f pytest-results.xml ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path("pytest-results.xml")
          if not path.exists():
              raise SystemExit(0)
          root = ET.parse(path).getroot()
          skipped = []
          for case in root.iter("testcase"):
              node = case.find("skipped")
              if node is not None:
                  skipped.append(
                      (case.get('classname', ''), case.get('name', ''),
                       node.get('message', 'skipped'))
                  )
          print(f"Skipped tests: {len(skipped)}")
          for classname, name, message in skipped:
              print(f"  - {classname}::{name} — {message}")
          unexpected = [
              (classname, name)
              for classname, name, _ in skipped
              if "test_sms_" not in classname
          ]
          if unexpected:
              print("Unexpected skips (only the optional SMS Reader suite may skip):")
              for classname, name in unexpected:
                  print(f"  - {classname}::{name}")
              raise SystemExit(1)
          PY
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
          if-no-files-found: ignore
