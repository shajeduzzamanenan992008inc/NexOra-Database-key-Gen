<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NexOra Database Key Gen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Share+Tech+Mono&display=swap">
<style>
:root{--bg:#03050d;--tx:#dbe7f3;--dim:#7f9bb5;--c1:#00f0ff;--c2:#3d7bff;--c3:#9b5cff;--pn:rgba(8,16,38,.6);--ln:rgba(0,240,255,.26);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.5 'Share Tech Mono','Courier New',monospace;overflow-x:hidden;display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 16px 48px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-3}
.aur{position:fixed;inset:-20%;z-index:-2;background:radial-gradient(40% 35% at 20% 25%,rgba(0,240,255,.2),transparent 70%),radial-gradient(35% 40% at 80% 30%,rgba(155,92,255,.22),transparent 70%),radial-gradient(40% 35% at 50% 90%,rgba(61,123,255,.2),transparent 70%);animation:aur 18s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(4%,3%) rotate(8deg) scale(1.15);filter:hue-rotate(35deg)}}
.grid{position:fixed;left:-50%;right:-50%;bottom:0;height:55vh;z-index:-1;background:linear-gradient(var(--ln) 1px,transparent 1px) 0 0/60px 60px,linear-gradient(90deg,var(--ln) 1px,transparent 1px) 0 0/60px 60px;transform:perspective(420px) rotateX(62deg);transform-origin:bottom;animation:gr 3s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 70%);mask-image:linear-gradient(transparent,#000 70%)}
@keyframes gr{to{background-position:0 60px,0 0}}
header{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;margin-top:6px}
#logo{width:min(210px,52vw);height:auto;filter:drop-shadow(0 0 18px rgba(0,240,255,.55));transition:transform .5s,filter .5s;cursor:pointer}
#logo:hover{transform:scale(1.1) rotate(-6deg);filter:drop-shadow(0 0 32px rgba(155,92,255,.85))}
h1{margin:0;font:800 clamp(26px,7vw,48px)/1.1 Orbitron,'Segoe UI',sans-serif;letter-spacing:.16em;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c1));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:300% 0}}
@keyframes gl{25%{transform:translate(-2px,1px);filter:drop-shadow(2px 0 #9b5cff) drop-shadow(-2px 0 #00f0ff)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-1px);filter:drop-shadow(-2px 0 #9b5cff) drop-shadow(2px 0 #00f0ff)}}
h1:hover{animation:flow 6s linear infinite,gl .35s steps(2) infinite}
.sub{color:var(--dim);letter-spacing:.32em;font-size:12px;text-transform:uppercase}
.sub b{color:var(--c1);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.card{position:relative;width:min(760px,100%);padding:26px;border-radius:20px;background:var(--pn);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);transition:transform .15s,box-shadow .35s;box-shadow:0 0 40px rgba(0,240,255,.12),inset 0 0 30px rgba(61,123,255,.08)}
.card:hover{box-shadow:0 0 70px rgba(0,240,255,.28),inset 0 0 40px rgba(155,92,255,.15)}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
.card::before{content:"";position:absolute;inset:-2px;border-radius:22px;padding:2px;background:conic-gradient(from var(--a),var(--c1),var(--c2),var(--c3),var(--c1));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sp 5s linear infinite;pointer-events:none}
@keyframes sp{to{--a:360deg}}
.lbl{font-size:11px;letter-spacing:.25em;color:var(--dim);margin:16px 0 8px;text-transform:uppercase}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{cursor:pointer;border:1px solid var(--ln);background:rgba(0,240,255,.05);color:var(--tx);font:inherit;padding:9px 16px;border-radius:10px;transition:.25s}
.chip:hover{transform:translateY(-3px);border-color:var(--c1);box-shadow:0 6px 22px rgba(0,240,255,.35)}
.chip.on{background:linear-gradient(135deg,rgba(0,240,255,.28),rgba(155,92,255,.34));border-color:var(--c1);box-shadow:0 0 18px rgba(0,240,255,.5)}
input[type=range]{width:100%;accent-color:var(--c1)}
.out{margin-top:20px;padding:18px;border-radius:14px;background:rgba(0,0,0,.5);border:1px solid var(--ln);position:relative;overflow:hidden;min-height:78px;word-break:break-all;cursor:pointer;font-size:clamp(14px,3.6vw,20px);color:var(--c1);text-shadow:0 0 10px rgba(0,240,255,.7);transition:.3s}
.out:hover{border-color:var(--c1);box-shadow:0 0 26px rgba(0,240,255,.35)}
.out::after{content:"";position:absolute;left:0;right:0;height:40%;top:-40%;background:linear-gradient(transparent,rgba(0,240,255,.16),transparent);animation:sc 3s linear infinite;pointer-events:none}
@keyframes sc{to{top:100%}}
.meter{height:8px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:14px}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c3),var(--c2),var(--c1));box-shadow:0 0 12px var(--c1);transition:width .8s cubic-bezier(.2,.9,.2,1)}
.stats{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--dim);margin-top:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.btn{flex:1 1 200px;cursor:pointer;border:0;font:700 14px Orbitron,'Segoe UI',sans-serif;letter-spacing:.2em;color:#03050d;padding:15px 30px;border-radius:12px;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));background-size:200% 100%;position:relative;overflow:hidden;transition:.3s}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:rgba(255,255,255,.55);transform:skewX(-20deg);transition:left .6s}
.btn:hover{background-position:100% 0;transform:translateY(-3px) scale(1.03);box-shadow:0 10px 36px rgba(61,123,255,.6)}
.btn:hover::after{left:130%}
.btn:active{transform:scale(.97)}
.btn.ghost{flex:0 1 auto;background:transparent;color:var(--c1);border:1px solid var(--c1)}
.btn.ghost:hover{background:rgba(0,240,255,.12);box-shadow:0 0 24px rgba(0,240,255,.5)}
#hist{display:grid;gap:6px}
#hist button{all:unset;display:block;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid transparent;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;transition:.25s}
#hist button:hover{border-color:var(--c3);color:var(--tx);background:rgba(155,92,255,.15);transform:translateX(6px)}
.tick{width:min(760px,100%);overflow:hidden;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);color:var(--dim);font-size:12px;white-space:nowrap;padding:6px 0}
.tick span{display:inline-block;padding-left:100%;animation:mq 24s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding:10px 18px;border-radius:10px;background:rgba(0,240,255,.15);border:1px solid var(--c1);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:.35s;z-index:9;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head>
<body>
<canvas id="bg"></canvas><div class="aur"></div><div class="grid"></div>
<header>
<svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="NexOra Database Key Gen logo">
<defs>
<linearGradient id="nxg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset=".55" stop-color="#3d7bff"/><stop offset="1" stop-color="#9b5cff"/></linearGradient>
<radialGradient id="nxc"><stop offset="0" stop-color="#00f0ff" stop-opacity=".5"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></radialGradient>
<filter id="nxf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="120" cy="120" r="90" fill="url(#nxc)"><animate attributeName="r" values="80;104;80" dur="3.2s" repeatCount="indefinite"/></circle>
<g filter="url(#nxf)" fill="none" stroke="url(#nxg)" stroke-linecap="round" stroke-linejoin="round">
<g><polygon points="120,14 212,67 212,173 120,226 28,173 28,67" stroke-width="3" stroke-dasharray="46 14"/><animateTransform attributeName="transform" type="rotate" from="0 120 120" to="360 120 120" dur="26s" repeatCount="indefinite"/></g>
<g><circle cx="120" cy="120" r="76" stroke-width="2" stroke-dasharray="3 9"/><animateTransform attributeName="transform" type="rotate" from="360 120 120" to="0 120 120" dur="15s" repeatCount="indefinite"/></g>
<circle cx="96" cy="120" r="22" stroke-width="5"/>
<path d="M118 120H178M158 120v18M174 120v12" stroke-width="5"/>
</g>
<circle cx="96" cy="120" r="7" fill="#fff"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#00f0ff"><animateMotion dur="6s" repeatCount="indefinite" path="M120 44a76 76 0 1 1 0 152a76 76 0 1 1 0-152z"/></circle>
</svg>
<h1>NEXORA</h1>
<div class="sub">Database Key Gen<b> _</b></div>
</header>
<main class="card" id="card">
<div class="lbl">// key format</div>
<div class="chips" id="fmt"></div>
<div class="lbl">// length: <span id="lv"></span></div>
<input type="range" id="len" min="16" max="128" value="64" aria-label="Key length">
<div class="out" id="out" aria-live="polite" title="Click to copy">INITIALIZING_</div>
<div class="meter"><i id="mt"></i></div>
<div class="stats"><span id="ent">ENTROPY 0 BIT</span><span id="cnt">FORGED 0</span></div>
<div class="row"><button class="btn" id="go">FORGE KEY</button><button class="btn ghost" id="cp">COPY</button></div>
<div class="lbl">// recent keys (click to copy)</div>
<div id="hist"></div>
</main>
<div class="tick"><span>CRYPTO.GETRANDOMVALUES ◆ CLIENT-SIDE ONLY ◆ NO KEY EVER LEAVES THIS TAB ◆ NEXORA DATABASE KEY GEN ◆ CRYPTO.GETRANDOMVALUES ◆ CLIENT-SIDE ONLY ◆ NO KEY EVER LEAVES THIS TAB</span></div>
<div id="toast"></div>
<script>
(()=>{
const $=i=>document.getElementById(i);
const R=n=>crypto.getRandomValues(new Uint8Array(n));
const pick=(s,n)=>{let o='';const m=256-256%s.length;while(o.length<n)for(const v of R(n*2))if(v<m&&o.length<n)o+=s[v%s.length];return o};
const A='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
const FM={
hex:{n:'HEX',a:16,z:128,d:64,gen:l=>pick('0123456789abcdef',l),bits:l=>l*4},
b64:{n:'BASE64',a:16,z:128,d:44,gen:l=>pick(A+'+/',l),bits:l=>l*6},
api:{n:'API KEY',a:24,z:96,d:40,gen:l=>'nx_live_'+pick(A,l),bits:l=>l*Math.log2(62)},
num:{n:'NUMERIC',a:6,z:32,d:12,gen:l=>pick('0123456789',l),bits:l=>l*Math.log2(10)},
uid:{n:'UUID v4',a:36,z:36,d:36,gen:()=>{const b=R(16);b[6]=b[6]&15|64;b[8]=b[8]&63|128;return [...b].map(v=>v.toString(16).padStart(2,'0')).join('').replace(/(.{8})(.{4})(.{4})(.{4})(.{12})/,'$1-$2-$3-$4-$5')},bits:()=>122}
};
let cur='hex',key='',n=0,HS=[],raf=0;
const fm=$('fmt'),ln=$('len'),out=$('out');
for(const k in FM){const b=document.createElement('button');b.className='chip';b.textContent=FM[k].n;b.dataset.k=k;b.onclick=()=>sel(k);fm.appendChild(b)}
function sel(k){cur=k;const f=FM[k];ln.min=f.a;ln.max=f.z;ln.value=f.d;ln.disabled=f.a==f.z;$('lv').textContent=ln.value;[...fm.children].forEach(c=>c.classList.toggle('on',c.dataset.k==k));go()}
ln.oninput=()=>{$('lv').textContent=ln.value};
ln.onchange=()=>go();
const CH='01ABCDEF#$%&@<>/\\';
function show(t){cancelAnimationFrame(raf);const L=t.length;let i=0;const st=()=>{const r=i|0;let s=t.slice(0,r);for(let j=r;j<L;j++)s+=CH[Math.random()*CH.length|0];out.textContent=s;i+=L/34;if(r<L)raf=requestAnimationFrame(st);else out.textContent=t};st()}
function go(){const f=FM[cur],l=+ln.value;key=f.gen(l);show(key);const b=f.bits(l);$('mt').style.width=Math.min(100,b/2.56)+'%';$('ent').textContent='ENTROPY '+Math.round(b)+' BIT';$('cnt').textContent='FORGED '+(++n);HS.unshift(key);HS=HS.slice(0,5);$('hist').replaceChildren(...HS.map(k=>{const e=document.createElement('button');e.textContent=k;e.onclick=()=>cp(k);return e}))}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
async function cp(t){t=t||key;if(!t)return;let ok=true;try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{ok=document.execCommand('copy')}catch(_){ok=false}a.remove()}toast(ok?'COPIED ✔':'COPY BLOCKED')}
$('go').onclick=()=>go();$('cp').onclick=()=>cp();out.onclick=()=>cp();
const cd=$('card');
cd.onmousemove=e=>{const r=cd.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;cd.style.transform=`perspective(900px) rotateY(${x*8}deg) rotateX(${-y*8}deg)`};
cd.onmouseleave=()=>{cd.style.transform=''};
$('logo').onclick=()=>go();
const cv=$('bg'),g=cv.getContext('2d');let W,V,P=[];const M={x:-999,y:-999};
const rs=()=>{W=cv.width=innerWidth;V=cv.height=innerHeight;P=Array.from({length:Math.min(90,W*V/13000|0)},()=>({x:Math.random()*W,y:Math.random()*V,vx:Math.random()-.5,vy:Math.random()-.5,h:[185,220,265][Math.random()*3|0]}))};
addEventListener('resize',rs);addEventListener('pointermove',e=>{M.x=e.clientX;M.y=e.clientY});
rs();
(function f(){g.clearRect(0,0,W,V);
const gr=g.createRadialGradient(M.x,M.y,0,M.x,M.y,200);gr.addColorStop(0,'rgba(0,240,255,.13)');gr.addColorStop(1,'rgba(0,240,255,0)');g.fillStyle=gr;g.fillRect(0,0,W,V);
for(let i=0;i<P.length;i++){const p=P[i];p.x+=p.vx*.6;p.y+=p.vy*.6;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>V)p.vy*=-1;
const dx=M.x-p.x,dy=M.y-p.y,d=Math.hypot(dx,dy);
if(d<190&&d>1){p.x+=dx/d*.7;p.y+=dy/d*.7;g.strokeStyle=`hsla(${p.h},100%,65%,${.5*(1-d/190)})`;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(M.x,M.y);g.stroke()}
g.fillStyle=`hsl(${p.h},100%,68%)`;g.beginPath();g.arc(p.x,p.y,1.8,0,6.283);g.fill();
for(let j=i+1;j<P.length;j++){const q=P[j],a=p.x-q.x,b=p.y-q.y,s=a*a+b*b;if(s<14000){g.strokeStyle=`hsla(${p.h},100%,65%,${.4*(1-s/14000)})`;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(q.x,q.y);g.stroke()}}}
requestAnimationFrame(f)})();
sel('hex');
})();
</script>
</body></html>
