<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="License key"><title>License key</title><defs><linearGradient id="lkg" gradientUnits="userSpaceOnUse" x1="40" y1="64" x2="216" y2="192"><stop offset="0.00" stop-color="#00E5FF"/><stop offset="1.00" stop-color="#3B82FF"/></linearGradient><radialGradient id="lkr"><stop offset="0" stop-color="#00E5FF" stop-opacity=".5"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient><linearGradient id="lkt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111B3A"/><stop offset="1" stop-color="#05070F"/></linearGradient><filter id="lkf" filterUnits="userSpaceOnUse" x="-20" y="-20" width="300" height="300"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="lkc"><rect x="12" y="12" width="232" height="232" rx="56"/></clipPath><style>.sp,.rv,.sf,.tw,.bu,.dt{transform-box:fill-box;transform-origin:center}
.sp{animation:sp 6s linear infinite}.rv{animation:sp 6s linear infinite reverse}.sf{animation:sp 3s linear infinite}
.pl{animation:pl 3s ease-in-out infinite}.fl{animation:fl 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}
.sw{animation:sw 6s cubic-bezier(.5,0,.3,1) infinite}.ch{animation:ch 3s linear infinite}
.ck{stroke-dasharray:100;animation:ck 6s ease-in-out infinite}.bu{animation:bu 3s ease-out infinite}
.dt{animation:dt 2s ease-in-out infinite}.dv{animation:dv 3s linear infinite}.dw{animation:dw 6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@keyframes sw{0%{transform:translateX(0)}55%,100%{transform:translateX(430px)}}
@keyframes ch{to{stroke-dashoffset:-100}}
@keyframes ck{0%,8%{stroke-dashoffset:100}25%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
@keyframes bu{0%{transform:scale(.55);opacity:.8}70%,100%{transform:scale(1.3);opacity:0}}
@keyframes dt{0%,50%,100%{opacity:.5;transform:translateY(0)}25%{opacity:1;transform:translateY(-5px)}}
@keyframes dv{from{transform:translateX(0)}to{transform:translateX(350px)}}
@keyframes dw{from{transform:translateX(-120px)}to{transform:translateX(800px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect x="12" y="12" width="232" height="232" rx="56" fill="url(#lkt)"/><g clip-path="url(#lkc)"><circle cx="128" cy="128" r="112" fill="url(#lkr)" class="pl"/><path d="M12 70H244M12 128H244M12 186H244M70 12V244M128 12V244M186 12V244" stroke="#00E5FF" stroke-opacity=".07" fill="none"/><polygon points="-120,-4 -64,-4 -100,260 -156,260" fill="#fff" fill-opacity=".13" class="sw"/></g><rect x="12.5" y="12.5" width="231" height="231" rx="55.5" fill="none" stroke="url(#lkg)" stroke-opacity=".6"/><g class="sp"><circle cx="128" cy="128" r="100" fill="none" stroke="url(#lkg)" stroke-opacity=".55" stroke-dasharray="2 9"/><circle cx="128" cy="28" r="3.5" fill="#fff" filter="url(#lkf)"/></g><circle cx="128" cy="128" r="86" fill="none" stroke="#00E5FF" stroke-opacity=".3" stroke-dasharray="46 12 8 12" class="rv"/><circle cx="52" cy="58" r="2.4" fill="#fff" class="tw"/><circle cx="206" cy="78" r="2" fill="#00E5FF" class="tw" style="animation-delay:-.7s"/><circle cx="198" cy="204" r="2.6" fill="#3B82FF" class="tw" style="animation-delay:-1.3s"/><circle cx="58" cy="196" r="1.8" fill="#fff" class="tw" style="animation-delay:-.3s"/><g class="fl"><g filter="url(#lkf)" fill="none" stroke="url(#lkg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M118 122L101 151.4H67L50 122L67 92.6H101Z M118 122H212 M172 122V148 M192 122V140"/><path d="M68 123L79 134L100 111" stroke="#fff" stroke-width="7" pathLength="100" class="ck"/><path d="M118 122L101 151.4H67L50 122L67 92.6H101Z M118 122H212 M172 122V148 M192 122V140" pathLength="100" stroke="#fff" stroke-width="2.6" stroke-dasharray="9 91" class="ch"/></g></g></svg>