<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="128" height="128" role="img" aria-label="OMEGA KEY"><title>OMEGA KEY</title><defs><linearGradient id="rmg" gradientUnits="userSpaceOnUse" x1="40" y1="64" x2="216" y2="192"><stop offset="0.00" stop-color="#00E5FF"/><stop offset="0.50" stop-color="#B57CFF"/><stop offset="1.00" stop-color="#FF4FD8"/></linearGradient><radialGradient id="rmr"><stop offset="0" stop-color="#00E5FF" stop-opacity=".5"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient><linearGradient id="rmt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111B3A"/><stop offset="1" stop-color="#05070F"/></linearGradient><filter id="rmf" filterUnits="userSpaceOnUse" x="-20" y="-20" width="300" height="300"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><clipPath id="rmc"><rect x="12" y="12" width="232" height="232" rx="56"/></clipPath><style>.sp,.rv,.sf,.tw,.bu,.dt{transform-box:fill-box;transform-origin:center}
.sp{animation:sp 6s linear infinite}.rv{animation:sp 6s linear infinite reverse}.sf{animation:sp 3s linear infinite}
.pl{animation:pl 3s ease-in-out infinite}.fl{animation:fl 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}
.sw{animation:sw 6s cubic-bezier(.5,0,.3,1) infinite}.ch{animation:ch 3s linear infinite}
.ck{stroke-dasharray:100;animation:ck 6s ease-in-out infinite}.bu{animation:bu 3s ease-out infinite}
.dt{animation:dt 2s ease-in-out infinite}.dv{animation:dv 3s linear infinite}.dw{animation:dw 6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1)}}
@keyframes sw{0%{transform:translateX(0)}55%,100%{transform:translateX(430px)}}
@keyframes ch{to{stroke-dashoffset:-100}}
@keyframes ck{0%,8%{stroke-dashoffset:100}25%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
@keyframes bu{0%{transform:scale(.55);opacity:.8}70%,100%{transform:scale(1.3);opacity:0}}
@keyframes dt{0%,50%,100%{opacity:.5;transform:translateY(0)}25%{opacity:1;transform:translateY(-5px)}}
@keyframes dv{from{transform:translateX(0)}to{transform:translateX(350px)}}
@keyframes dw{from{transform:translateX(-120px)}to{transform:translateX(800px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect x="12" y="12" width="232" height="232" rx="56" fill="url(#rmt)"/><g clip-path="url(#rmc)"><circle cx="128" cy="128" r="112" fill="url(#rmr)" class="pl"/><path d="M12 70H244M12 128H244M12 186H244M70 12V244M128 12V244M186 12V244" stroke="#00E5FF" stroke-opacity=".07" fill="none"/><polygon points="-120,-4 -64,-4 -100,260 -156,260" fill="#fff" fill-opacity=".13" class="sw"/></g><rect x="12.5" y="12.5" width="231" height="231" rx="55.5" fill="none" stroke="url(#rmg)" stroke-opacity=".6"/><g transform="translate(128 126) scale(1.18) translate(-128 -126)"><g class="fl"><g filter="url(#rmf)" fill="none" stroke="url(#rmg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M80 136H102.8A44 44 0 1 1 153.2 136H176 M128 109V200 M128 168H147 M128 184H141"/><circle cx="128" cy="100" r="9" fill="url(#rmg)" stroke="none" class="pl"/><path d="M80 136H102.8A44 44 0 1 1 153.2 136H176 M128 109V200 M128 168H147 M128 184H141" pathLength="100" stroke="#fff" stroke-width="2.6" stroke-dasharray="9 91" class="ch"/></g></g></g></svg>