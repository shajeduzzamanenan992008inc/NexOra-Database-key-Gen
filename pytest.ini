[pytest]
testpaths = tests
addopts = -q -ra
filterwarnings =
    default
markers =
    unit: isolated tests with no database or network dependency
    integration: tests that use the disposable PostgreSQL test database
    reader: Reader App activation, credential, heartbeat and revocation tests
    security: authentication, authorization, injection and secret-handling tests
    postgres: PostgreSQL-specific integration tests
    generator: Classic Universal Key Generator regression tests
    sms: optional SMS Reader console tests (requires the sms_reader package)
